{{- /* 리포트 거르기 버튼 (회사 페이지·리포트 목록 공용, 2026-10-23): 전체 / 기업 분석 / 주간 업데이트 / 실적 리뷰 / 증권사.
       '증권사'(증권사 리포트 요약·원문 링크)는 외부 리포트 데이터(data/external/)가 생겨 .Params.reportType이 EXT인 글이 있을 때만 보임 */ -}}
<div class="filters" data-filters role="group" aria-label="리포트 종류">
  <button type="button" data-f="all" aria-pressed="true">전체</button>
  {{- range site.Params.reportTypes }}
  <button type="button" data-f="{{ .key }}" aria-pressed="false">{{ .name }}</button>
  {{- end }}
  {{- if .hasExternal }}<button type="button" data-f="EXT" aria-pressed="false">증권사</button>{{ end }}
</div>
