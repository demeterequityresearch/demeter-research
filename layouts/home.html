{{- define "main" }}
{{- /* 홈: 구글식 검색바(회사명·종목코드) → 회사 페이지로 이동. 검색 동작은 static/js/search.js(상단 바 검색창과 같이 씀),
       회사 목록은 index.json. 첫 화면은 검색창이 가운데, 바닥글 Disclaimer는 상단 바 높이만큼만 보이게(2026-10-20) */ -}}
<section class="home">
  <form class="search" data-search="home" data-index="{{ "index.json" | relLangURL }}" role="search" autocomplete="off">
    <h1 class="sr-only">기업 검색</h1>
    <div class="search-box">
      <label class="search-field" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span class="sr-only">회사명 또는 종목코드</span>
        <input id="q" type="search" placeholder="회사명 또는 종목코드 검색" maxlength="64" autofocus
          role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
        <button class="search-btn" type="submit">검색</button>
      </label>
      <ul class="suggest" id="suggest" role="listbox" aria-label="검색 결과" hidden></ul>
    </div>
  </form>
</section>
{{- end }}
