baseURL = "https://demeterequityresearch.github.io/demeter-research/"
languageCode = "ko-kr"
title = "Demeter Equity Research"
theme = "PaperMod"

# 마크다운 안의 HTML(iframe, 소개·리서치 방법 페이지의 레이아웃) 허용
[markup.goldmark.renderer]
  unsafe = true

# 홈 검색바용 색인(index.json, 회사 목록)
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  # 다크 모드는 기기 설정을 따름 (전환 버튼 없음)
  defaultTheme = "auto"
  disableThemeToggle = true
  disableScrollToTop = true
  ShowReadingTime = false
  ShowToc = false
  mainSections = ["reports"]

  # 상단 왼쪽 엠블럼 (static/images/logo.png)
  [params.label]
    icon = "images/logo.png"

  # 리포트 종류: 회사 페이지의 세 칸 순서·이름·설명. 리포트 제목에 쓰는 이름은 scripts/convert.py의 TYPES (둘을 같이 고칠 것)
  [[params.reportTypes]]
    key = "BO"
    name = "기업 기본 분석"
    desc = "산업 구조, 경쟁 구도, 재무, Peer 대비 밸류에이션, 주가 변동 요인을 정리한 기본 리포트입니다."
  [[params.reportTypes]]
    key = "WR"
    name = "주간 업데이트"
    desc = "한 주의 시세와 기술적 지표, 공시와 보도, 모니터링 지표의 변화를 짚습니다."
  [[params.reportTypes]]
    key = "QR"
    name = "분기 실적 분석"
    desc = "분기 실적을 직전 분기·전년 동기·컨센서스와 비교하고 앞선 리포트의 가설을 점검합니다."

  # 면책 고지(모든 페이지 바닥글)는 data/disclaimer.json (원본 report_utils.DISCLAIMER_TEXT, scripts/publish.py가 옮김)

# 상단 메뉴 (검색은 홈 화면 검색바)
[menu]
  [[menu.main]]
    name = "소개"
    pageRef = "/about"
    weight = 1
  [[menu.main]]
    name = "리서치 방법"
    pageRef = "/method"
    weight = 2
  [[menu.main]]
    name = "리포트"
    pageRef = "/reports"
    weight = 3
