baseURL = "https://alphainsight.co.kr/"
languageCode = "ko-kr"
title = "Alpha Insight"
theme = "PaperMod"

# 검색엔진(2026-10-21): robots.txt에 사이트맵 주소(sitemap.xml)를 적어 알림. 쓰지 않는 태그·분류 페이지는 만들지 않음(사이트맵에서도 빠짐)
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# 마크다운 안의 HTML(iframe, 소개·리서치 방법 페이지의 레이아웃) 허용
[markup.goldmark.renderer]
  unsafe = true

# 홈 검색바용 색인(index.json, 회사 목록)
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  # 다크 모드는 기기 설정을 따름 (전환 버튼 없음)
  defaultTheme = "auto"
  disableThemeToggle = true
  disableScrollToTop = true
  ShowReadingTime = false
  ShowToc = false
  mainSections = ["reports"]

  # 이용약관(content/terms.md) 시행일. 약관을 바꾸면 함께 고침: 가입할 때 회원 정보(user_metadata.terms_agreed)에 이 날짜를 남김
  termsDate = "2026-10-21"

  # 사이트 아이콘(static/images/logo.png, 파비콘과 같은 "a." 모양). 상단 로고는 header.html의 글자 로고
  [params.label]
    icon = "images/logo.png"

  # 리포트 종류: 회사 페이지의 세 칸 순서·이름·설명. 리포트 제목에 쓰는 이름은 scripts/convert.py의 TYPES (둘을 같이 고칠 것)
  [[params.reportTypes]]
    key = "BO"
    name = "기업 분석"
    desc = "사업·산업·재무·밸류에이션을 한 번에 정리한 기본 리포트"
  [[params.reportTypes]]
    key = "WU"
    name = "주간 업데이트"
    desc = "한 주의 주가·공시·뉴스와 다음 주 체크포인트"
  [[params.reportTypes]]
    key = "QR"
    name = "실적 리뷰"
    desc = "분기 실적 점검과 앞선 리포트의 가설 확인"

  # 회원 로그인·리포트 보관함 (Supabase 프로젝트 bfhkkaeyvdtmzpxxdlrc). key는 공개돼도 되는 publishable key.
  # secret key는 절대 여기나 저장소에 넣지 않음 (리포트 올릴 때만 PC의 .secrets.env에서 읽음)
  # 회원만 보는 곳: reports, companies 섹션 (layouts/_partials/member.html)
  [params.supabase]
    url = "https://bfhkkaeyvdtmzpxxdlrc.supabase.co"
    key = "sb_publishable_ekB9Lp0c1a3OTNK5A5quVw_R8l-2y_Y"
    bucket = "reports"

  # 리포트 PDF 보관(2026-10-19 사용자 결정, Supabase 무료 1GB 대신): Cloudflare R2 비공개 버킷 + 회원 확인 Worker.
  # 공개값만 둠. API 토큰은 .secrets.env의 CLOUDFLARE_API_TOKEN (scripts/cloudflare.py)
  # 종목별 보관 개수(넘으면 가장 오래된 것을 R2와 사이트 목록에서 지움, 전체 게시본은 ../Published): scripts/publish.py의 KEEP
  [params.cloudflare]
    accountId = "63462e99d11f4ba3d07c93deabf1a8b2"
    bucket = "demeter-reports"
    workerName = "demeter-reports"
    worker = "https://demeter-reports.demeter-equityresearch.workers.dev"
    allowedOrigins = "https://alphainsight.co.kr,https://www.alphainsight.co.kr,https://demeterequityresearch.github.io"
    # 방문 분석(2026-10-21 사용자 결정): Cloudflare Web Analytics. 쿠키를 쓰지 않음. 대시보드 Web Analytics에서 사이트를 등록하고
    # 받은 JS 스니펫의 token(공개값)을 넣으면 모든 페이지에 스크립트가 들어감(layouts/_partials/extend_head.html). 빈칸이면 넣지 않음
    analyticsToken = ""

  # 검색엔진 소유 확인(2026-10-21): 구글 서치 콘솔·네이버 서치어드바이저에서 받은 확인 코드(공개값)를 넣으면
  # 모든 페이지 <head>에 확인 태그가 들어감(테마 head.html). 등록·로그인은 사용자가 직접
  [params.analytics.google]
    SiteVerificationTag = ""
  [params.analytics.naver]
    SiteVerificationTag = ""

  # 면책 고지(모든 페이지 바닥글)는 data/disclaimer.json (원본 report_utils.DISCLAIMER_TEXT, scripts/publish.py가 옮김)

# 상단 메뉴 (검색은 홈 화면 검색바)
[menu]
  [[menu.main]]
    name = "소개"
    pageRef = "/about"
    weight = 1
  [[menu.main]]
    name = "리포트"
    pageRef = "/reports"
    weight = 2
  [[menu.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 3
