name: Deploy site

# main에 push할 때 + 매일 아침(시세·재무 갱신, 2026-10-20) + 수동 실행
# 매일 실행: scripts/market.py가 KRX·DART에서 받아 Supabase DB에 기록(2026-10-22부터 저장소에 커밋하지 않음).
# 빌드 때마다(push 포함) scripts/sync_db.py export가 DB에서 data/market·static/market 파일을 만들어 Hugo가 읽음. Claude는 쓰지 않음
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 23 * * *"   # 매일 08:30 KST (KRX Open API는 전 거래일 시세를 다음 날 아침에 올림)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update market data
        if: github.event_name != 'push'
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$KRX_API_KEY$DART_API_KEY" ]; then echo "키가 아직 없음: 시세 갱신 건너뜀"; exit 0; fi
          python3 scripts/market.py

      - name: Export market data from DB
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 scripts/sync_db.py export

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_extended_0.167.0_linux-amd64.deb
          sudo dpkg -i hugo_extended_0.167.0_linux-amd64.deb

      - name: Convert reports
        run: python3 scripts/convert.py

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
